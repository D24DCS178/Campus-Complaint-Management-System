name: Campus Complaint CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies
        working-directory: server
        run: npm install

      - name: Install Client Dependencies
        working-directory: client
        run: npm install

      - name: Lint Client
        working-directory: client
        run: npm run lint

      - name: Build React App
        working-directory: client
        run: npm run build

      - name: CI Completed
        run: echo "Campus Complaint Management System CI Passed!"