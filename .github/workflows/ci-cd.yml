name: Campus Complaint CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Server Dependencies
        working-directory: server
        run: npm install

      - name: Install Client Dependencies
        working-directory: client
        run: npm install

      - name: Lint Client
        working-directory: client
        run: npm run lint

      - name: Build React App
        working-directory: client
        run: npm run build

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Server Image
      - name: Build Server Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/campus-server:latest ./server

      # Build Client Image
      - name: Build Client Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/campus-client:latest ./client

      # Push Server Image
      - name: Push Server Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/campus-server:latest

      # Push Client Image
      - name: Push Client Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/campus-client:latest

      - name: CI/CD Completed
        run: echo "Campus Complaint Management System CI/CD Pipeline Passed!"